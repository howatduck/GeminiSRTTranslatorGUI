name: Build Windows EXE

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --clean --noconfirm GeminiSRTTranslator.spec

      - name: Package into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\GeminiSRTTranslator.exe" -DestinationPath "GeminiSRTTranslator-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiSRTTranslator-Windows
          path: GeminiSRTTranslator-Windows.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GeminiSRTTranslator-Windows.zip   # <-- ZIP으로 변경
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
