name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch gemini-srt-translator library syntax errors
        shell: python
        run: |
          import os, glob, site
          rep1 = b'            text = ev.text.replace(r"\\N", "\\n").replace(r"\\n", "\\n")\n'
          rep2 = b'                subs[idx].text = sub.content.replace("\\n", r"\\N")\n'

          for sp in site.getsitepackages():
              pattern = os.path.join(sp, "gemini_srt_translator", "main.py")
              for fpath in glob.glob(pattern):
                  print(f"Patching {fpath}...")
                  with open(fpath, "rb") as f:
                      lines = f.readlines()
                  
                  changed = False
                  for i in range(len(lines)):
                      if b'ev.text.replace' in lines[i]:
                          print(f"Found line {i+1}: {lines[i]}")
                          lines[i] = rep1
                          changed = True
                      elif b'sub.content.replace' in lines[i]:
                          print(f"Found line {i+1}: {lines[i]}")
                          lines[i] = rep2
                          changed = True
                  
                  if changed:
                      with open(fpath, "wb") as f:
                          f.writelines(lines)
                      # Verify syntax
                      with open(fpath, "rb") as f:
                          compile(f.read(), fpath, "exec")
                      print(f"Successfully patched and verified {fpath}")


      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --clean --noconfirm GeminiSRTTranslator.spec


      - name: Package into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\GeminiSRTTranslator.exe" -DestinationPath "GeminiSRTTranslator-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GeminiSRTTranslator-Windows
          path: GeminiSRTTranslator-Windows.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: GeminiSRTTranslator-Windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

